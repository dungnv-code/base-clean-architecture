services:
  web:
    image: ${DOCKER_IMAGE}:${DOCKER_TAG}
    ports:
      - "${APP_PORT}:143"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=http://0.0.0.0:143
    # xóa bỏ nếu triển khai product
    volumes:
      - /home/zamiga/data/logs/${DOCKER_IMAGE}/${ASPNETCORE_ENVIRONMENT}:/app/Logs
    restart: always
    networks:
      - shared-net
networks:
  shared-net:
    external: true
    name: shared-net
