stages:
  - publish
  - deploy

variables:
  DOCKER_IMAGE: "market-app-api"

workflow:
  rules:
    # 1. Tag trên develop → DEV
    - if: '$CI_COMMIT_TAG =~ /^dev_/'
      variables:
        ENV_NAME: development
        DOCKER_TAG: development
        APP_PORT: 7390
        ASPNETCORE_ENVIRONMENT: Development

    # 2. Tag trên staging → staging
    - if: '$CI_COMMIT_TAG =~ /^staging_/'
      variables:
        ENV_NAME: staging
        DOCKER_TAG: staging
        APP_PORT: 7390
        ASPNETCORE_ENVIRONMENT: Staging

    # 3. Merge hoặc push lên staging → STAGING
    - if: '$CI_COMMIT_BRANCH == "staging" && $CI_PIPELINE_SOURCE =~ /push|merge_request_event/'
      variables:
        ENV_NAME: staging
        DOCKER_TAG: staging
        APP_PORT: 7390
        ASPNETCORE_ENVIRONMENT: Staging

    # 4. Còn lại → không chạy
    - when: never

publish:
  stage: publish
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    GIT_STRATEGY: clone
  script:
    - echo "Building image $DOCKER_IMAGE:$DOCKER_TAG for $ENV_NAME"
    - docker image prune -af
    - docker build -t $DOCKER_IMAGE:$DOCKER_TAG .
    - docker images
  tags:
    - zamiga
  rules:
    - if: '$ENV_NAME'

deploy:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    GIT_STRATEGY: none
  script:
    - echo "Deploying $ENV_NAME"
    # - docker compose pull || true
    - docker compose -p ${DOCKER_IMAGE}_${ENV_NAME} up -d --build --remove-orphans
  environment:
    name: $ENV_NAME
  tags:
    - zamiga
  rules:
    - if: '$ENV_NAME'
