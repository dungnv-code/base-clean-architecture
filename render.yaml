services:
  - type: web
    name: marketapp-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Kafka__BootstrapServers
        sync: false
      - key: Kafka__TopicPrefix
        value: market.
      - key: Kafka__GroupId
        value: market-api
