services:
  - type: web
    name: marketapp-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Render route traffic vào port này
    port: 10000
    # Render dùng endpoint này để kiểm tra app có sống không
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Buộc .NET lắng nghe đúng port Render yêu cầu
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      # Secrets — điền trực tiếp trên Render Dashboard, không commit vào repo
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Kafka__BootstrapServers
        sync: false
      - key: Kafka__TopicPrefix
        value: market.
      - key: Kafka__GroupId
        value: market-api
